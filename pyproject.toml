[project]
name = "rolypoly-db"
version = "0.1.0"
description = "Reproducible database construction workflows for RolyPoly"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Uri Neri", email = "uneri@lbl.gov" }]
dependencies = [
    "mappy>=2.31,<3",
    "needletail>=0.7.3,<0.8",
    "psutil>=7.2.2,<8",
    "pyfastx>=2.3.1,<3",
    "pyhmmer>=0.12.1,<0.13",
    "requests>=2.34.2,<3",
    "rich-click>=1.9.8,<2",
    "rich>=15.0.0,<16", 
    "intervaltree>=3.2.1,<4",
    "polars>=1.43.0,<2",
    "bbmapy>=0.0.57,<0.0.58",
    "xxhash>=3.8.1,<4",
    "pyrodigal-rv>=0.1.0,<0.2",
    "parasail>=1.3.4,<2",
    "pyopal>=0.7.3,<0.8",
    "pydustmasker>=3.2.0,<4",
    "pyarrow>=25.0.0,<26",
    "linearfold>=1.1,<2",
    "viennarna>=2.7.2,<3",
    "numpy>=2.3.0,<3",
  "taxopy>=0.1.0,<0.2",
  "rolypoly-tk>=0.7.17,<0.8",
    "nbmerge>=0.0.4,<0.0.5",
  
]

[project.scripts]
rolypoly-build-data = "rolypoly_db.build_data:build_data"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rolypoly_db"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
rolypoly-db = { path = ".", editable = true }
lets-plot = ">=4.11.0, <5"
itables = ">=2.9.0, <3"
fastexcel = ">=0.12,<1"
taxopy = ">=0.1.0, <0.2"

[tool.pixi.dependencies]
python = ">=3.10,<3.15"
pip = ">=26.1,<27"
mmseqs2 = ">=18.8cc5c,<19"
diamond = ">=2.2.4,<3"
blast = ">=2.17,<3"
infernal = ">=1.1.5,<2"
taxonkit = ">=0.20,<0.21"
aria2 = ">=1.37,<2"
parallel = ">=20250622,<20270000"
htslib = ">=1.23,<2"
pytest = ">=9.1,<10"
ruff = ">=0.15,<0.16"
jupyter = ">=1.1,<2"
seqkit = ">=2.13.0,<3"
bwa-mem2 = ">=2.3,<3"
falco = ">=1.3.1,<2"
pigz = ">=2.8,<3"
uv = ">=0.11.29,<0.12"
ipython = ">=8.37.0,<9"
ipykernel = ">=7.3.0,<8"
google-cloud-sdk = ">=578.0.0,<579"
entrez-direct = ">=24.0,<25"
eutils = ">=0.6.1,<0.7"
ca-certificates = ">=2026.7.22,<2027"
certifi = ">=2026.7.22,<2027"
openssl = ">=3.6.3,<4"


[tool.pixi.tasks]
test = "python -m pytest -q"
lint = "ruff check src tests"
build-data = "python -m rolypoly_db.build_data"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint.per-file-ignores]
"src/rolypoly_db/build_data.py" = ["E712", "F841"]
